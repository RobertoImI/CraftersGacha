modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Crafters CR"

# Importantísimo:
# El JAR de CraftersGacha no necesita estar instalado en el cliente.
displayTest="IGNORE_SERVER_VERSION"

description='''
Sistema server-side de gachas/crates para Crafters CR.
Permite premios modded/vanilla, pesos, llaves, hologramas,
partículas y ruleta visual.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"